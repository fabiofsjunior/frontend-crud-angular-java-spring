<mat-card>
  <mat-card-content>
    <form>
      <div class="login-root">
        <div
          class="box-root padding-top--24 flex-flex flex-direction--column"
          style="flex-grow: 1; z-index: 9"
        >
          <div
            class="box-root padding-top--48 padding-bottom--24 flex-flex flex-justifyContent--center"
          >
            <h1>
              <img src="../../../../assets/logovem.png" alt="">
            </h1>
          </div>
          <div class="formbg-outer">
            <div class="formbg">
              <div class="formbg-inner padding-horizontal--48">
                <span id="centralizar" class="padding-bottom--15">LOGIN | Entre com sua conta</span>
                <form id="stripe-login">
                  <div class="field padding-bottom--24">
                    <label for="email">Email</label>
                    <input
                      formControlName="Email"
                      placeholder="Email"
                      type="email"
                      name="email"
                    />
                  </div>
                  <div class="field padding-bottom--24">
                    <div class="grid--50-50">
                      <label for="password">Senha</label>
                    </div>
                    <input
                      placeholder="Senha"
                      type="password"
                      name="password"
                    />
                  </div>
                  <div
                    class="field field-checkbox padding-bottom--24 flex-flex align-center"
                  >
                    <label for="checkbox">
                      <input type="checkbox" name="checkbox" />Manter-me
                      conectado
                    </label>
                  </div>
                  <div class="field padding-bottom--24">
                    <input
                      id="sumbmit"
                      routerLink="/usuarios"
                      type="submit"
                      name="submit"
                      value="Continue"
                    />

                  </div>
                  <div>
                    <div class="reset-pass">
                      <a href="#">Esqueci minha senha.</a>
                      <a href="#">Alterar meu email.</a>
                      <a href="#">Crie sua conta.</a>

                    </div>
                </div>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
